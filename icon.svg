<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e4e"/>
      <stop offset="50%" stop-color="#1f104f"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="pinkWand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- アプリアイコン背景（丸角スクエア） -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- 外周の魔法陣サークル -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f472b6" stroke-width="5" stroke-dasharray="14 10" opacity="0.65"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.45"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <!-- 魔法陣の星型 -->
  <polygon points="256,65 305,190 440,205 335,295 370,430 256,360 142,430 177,295 72,205 207,190" fill="none" stroke="#ec4899" stroke-width="3.5" opacity="0.4"/>

  <!-- 魔法のステッキ -->
  <g filter="url(#glow)">
    <!-- ステッキの軸 -->
    <line x1="140" y1="390" x2="310" y2="220" stroke="#fce7f3" stroke-width="16" stroke-linecap="round"/>
    <line x1="140" y1="390" x2="310" y2="220" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>
    
    <!-- ステッキ先端のリボン・ハートフレーム -->
    <path d="M 310,220 C 285,175 230,175 230,220 C 230,265 310,320 310,320 C 310,320 390,265 390,220 C 390,175 335,175 310,220 Z" fill="url(#pinkWand)" opacity="0.9"/>
    
    <!-- 中央の大結晶（黄金の星） -->
    <path d="M 310,120 L 328,180 L 390,195 L 330,212 L 310,270 L 292,212 L 230,195 L 290,180 Z" fill="url(#goldStar)"/>
    <circle cx="310" cy="195" r="12" fill="#ffffff"/>
  </g>

  <!-- きらめく魔法の星屑 -->
  <path d="M 120,130 L 126,152 L 148,158 L 126,164 L 120,186 L 114,164 L 92,158 L 114,152 Z" fill="#f472b6" filter="url(#glow)"/>
  <path d="M 410,330 L 414,345 L 429,349 L 414,353 L 410,368 L 406,353 L 391,349 L 406,345 Z" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="160" cy="270" r="7" fill="#fb7185" filter="url(#glow)"/>
  <circle cx="380" cy="110" r="9" fill="#fed7aa" filter="url(#glow)"/>
</svg>
